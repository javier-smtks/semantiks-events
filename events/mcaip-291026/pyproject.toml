[project]
name = "semantiks-cua"
version = "0.1.0"
description = "Chat with an AI agent that controls your laptop, cross-OS. Powered by trycua/cua + OpenAI gpt-6.1-sol."
requires-python = ">=3.11"
dependencies = [
  "openai>=1.60.0",
  "cua-driver",
  "deepagents>=0.7.0",
  "langchain-openai>=1.0.0,<2.0.0",
  "langsmith>=0.1.0",
  "python-dotenv>=1.0.1",
  "httpx>=0.27.0",
  "rich>=13.7.0",
  "posthog>=3.0.0"
]

[project.scripts]
semantiks-cua = "semantiks_cua.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
